{% load static %}

<style>
    :root {
        --fp-blue: #2874F0;
        --fp-yellow: #FFE11B;
    }

    .header-main {
        padding: 12px 0;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    /* LOGO */
    .apna-logo {
        font-size: 32px;
        font-weight: 800;
        color: var(--fp-blue);
        white-space: nowrap;
        display: inline-block;
    }
    .campus-yellow { color: var(--fp-yellow); }

    /* CATEGORY BUTTON */
    .category-btn {
        background: var(--fp-blue);
        color: white;
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 600;
        white-space: nowrap;
    }

    /* SEARCH BOX */
    .search-input {
        height: 44px;
        border-radius: 8px 0 0 8px;
    }
    .search-btn {
        height: 44px;
        background: var(--fp-blue);
        color: white;
        border-radius: 0 8px 8px 0;
    }

    /* CART */
    .cart-icon {
        background: var(--fp-blue);
        color: white;
        padding: 10px;
        border-radius: 50%;
    }
    .cart-badge {
        background: var(--fp-yellow);
        color: black;
        font-weight: bold;
        position: absolute;
        top: -6px;
        right: -8px;
        padding: 3px 8px;
        border-radius: 50%;
    }

    /* FIX ALIGN SPACING */
    .logo-col { padding-right: 20px !important; }
    .cat-col { padding-left: 20px !important; }
  nav a { margin-right: 20px; }
</style>


<header class="section-header">
<section class="header-main">
    <div class="container">

        <div class="row align-items-center">

            <!-- LOGO -->
            <div class="col-lg-2 col-6 d-flex align-items-center logo-col">
                <a href="{% url 'home' %}">
                    <span class="apna-logo">apna<span class="campus-yellow">Campus</span></span>
                </a>
            </div>

            <!-- CATEGORIES -->
            <div class="col-lg-2 col-6 d-flex align-items-center cat-col">
                <div class="dropdown w-100">
                    <button class="category-btn dropdown-toggle w-100" data-toggle="dropdown">
                        <i class="fa fa-bars mr-1"></i> Categories
                    </button>
                    <div class="dropdown-menu w-100">
                        <a class="dropdown-item" href="{% url 'store' %}">All Products</a>
                        {% for category in links %}
                            <a class="dropdown-item" href="{{ category.get_url }}">{{ category.category_name }}</a>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <!-- SEARCH -->
            <div class="col-lg-5 col-12 mt-3 mt-lg-0">
                <form action="{% url 'search' %}" method="GET">
                    <div class="input-group">
                        <input type="text" name="keyword" class="form-control search-input" placeholder="Search products...">
                        <div class="input-group-append">
                            <button class="btn search-btn"><i class="fa fa-search"></i></button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- USER + CART -->
            <div class="col-lg-3 col-12 mt-3 mt-lg-0">
                <div class="d-flex justify-content-end align-items-center">

                    {% if user.id %}
                        <div class="mr-3 text-right">
                            <small>Welcome {{ user.first_name }}</small><br>
                            <a href="{% url 'dashboard' %}">Dashboard</a> |
                            <a href="{% url 'logout' %}">Logout</a>
                        </div>
                    {% else %}
                        <div class="mr-3 text-right">
                            <small>Welcome Guest!</small><br>
                            <a href="{% url 'login' %}">Sign in</a> |
                            <a href="{% url 'register' %}">Register</a>
                        </div>
                    {% endif %}

                    <a href="{% url 'cart' %}" class="position-relative ml-3">
                        <div class="cart-icon"><i class="fa fa-shopping-cart"></i></div>
                        <span class="cart-badge">{{ cart_count }}</span>
                    </a>

                </div>
            </div>

        </div>

    </div>
</section>
</header>
