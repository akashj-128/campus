{% extends 'base.html' %}

{% block content %}

<style>
    .forgot-card {
        max-width: 500px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        border: none;
        width: 100%;
    }

    .forgot-header {
        background: linear-gradient(135deg, #2979ff, #00b0ff);
        padding: 22px;
        border-radius: 18px 18px 0 0;
        color: #fff;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
    }

    .form-control {
        height: 48px;
        border-radius: 10px;
        border: 1px solid #ddd;
    }

    .btn-primary {
        background: linear-gradient(135deg, #ff6d00, #ff9100);
        border: none;
        height: 50px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 600;
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #ff9100, #ff6d00);
    }

    .forgot-text a {
        font-weight: bold;
        color: #2979ff;
    }

    /* Centering the card */
    .forgot-section {
        min-height: 84vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px 0;
    }

    .card-body p {
        font-size: 15px;
        color: #555;
        text-align: center;
        margin-top: -8px;
    }

</style>

<section class="section-content forgot-section">

    <div class="card forgot-card">

        <div class="forgot-header">
            Forgot Password?
        </div>

        <div class="card-body">
            <p>
                Enter your email and we'll send you reset instructions.
            </p>

            {% include 'includes/alerts.html' %}

            <form action="{% url 'forgotPassword' %}" method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <input type="email" 
                           class="form-control" 
                           placeholder="Email Address" 
                           name="email">
                </div>

                <div class="form-group mb-2 text-right">
                    <a href="{% url 'login' %}">Already have password? Login</a>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        Submit
                    </button>
                </div>
            </form>

        </div>

    </div>

    <p class="text-center mt-4 forgot-text">
        Don’t have an account? 
        <a href="{% url 'register' %}">Sign up</a>
    </p>

</section>

{% endblock %}
